version = 1

# Unit-test inputs (lit RUN lines, see test/lit.cfg.py), sample C sources, and
# the programs the execution tests compile and run.
[[annotations]]
path = ["test/spmd/**", "test/exec/**"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
SPDX-FileCopyrightText = "2025 RWTH Aachen University"

# API descriptions consumed by convert-apiCalls-to-spmd. Generated by USIS
# (https://github.com/RWTH-HPC/USIS) from each model's own primary source and
# copied here verbatim -- our own artifacts, not vendor files, which is why
# the copyright below is unchanged; see includesProgramModels/README.md.
# Covered here rather than in-file because JSON has no comment syntax.
[[annotations]]
path = ["includesProgramModels/**/api.json"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
SPDX-FileCopyrightText = "2025 Semih Burak, RWTH Aachen University"

# Files whose format cannot carry a comment: bazelisk reads the whole of
# .bazelversion as a version string, and .gitmodules is parsed by git.
[[annotations]]
path = [".bazelversion", ".gitmodules"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
SPDX-FileCopyrightText = "2025 Semih Burak, RWTH Aachen University"

# Figures rendered from the .tex beside them by docs/figures/Makefile; the
# binary output cannot carry a header of its own.
[[annotations]]
path = ["docs/figures/*.pdf", "docs/figures/*.png"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
SPDX-FileCopyrightText = "2026 Semih Burak, RWTH Aachen University"

# Patches applied to @jax / @xla by Enzyme-JAX's repository macros. These are
# copies of Enzyme-JAX's own patches/ files, not spmd-authored -- see
# patches/README.md for why they have to live in this repository.
[[annotations]]
path = ["patches/*.patch"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
SPDX-FileCopyrightText = "The Enzyme / Enzyme-JAX authors"

# Vendored programming-model headers. Declared here rather than in-file on
# purpose: these tags were originally added in-file on main and were then lost
# when this branch re-imported and modified the headers, which is what left the
# vendor licences showing as unused. A path glob survives the next re-import.
[[annotations]]
path = ["includesProgramModels/mpi/include/**"]
SPDX-License-Identifier = "LicenseRef-MPICH"
SPDX-FileCopyrightText = "Argonne National Laboratory"

[[annotations]]
path = ["includesProgramModels/shmem/include/**"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileCopyrightText = "2011 Sandia Corporation"

# Unmodified NVIDIA headers.
[[annotations]]
path = ["includesProgramModels/nccl/include/nccl_net.h",
        "includesProgramModels/mynvshmem/include/nvshmemx.h",
        "includesProgramModels/mynvshmem/include/nvshmem_common_transport.h"]
SPDX-License-Identifier = "LicenseRef-NCCL"
SPDX-FileCopyrightText = "2015-2021 NVIDIA Corporation"

# NVIDIA headers this project has altered (extra declarations so that
# convert-apiCalls-to-spmd's api.json descriptions have something to bind to).
# NVIDIA remains the copyright holder of the original and its licence still
# governs the file; the second line covers our modifications only.
[[annotations]]
path = ["includesProgramModels/nccl/include/nccl.h"]
SPDX-License-Identifier = "LicenseRef-NCCL"
SPDX-FileCopyrightText = ["2015-2021 NVIDIA Corporation",
                          "2025 Semih Burak, RWTH Aachen University"]

[[annotations]]
path = ["includesProgramModels/mynvshmem/include/nvshmem.h",
        "includesProgramModels/mynvshmem/include/nvshmem_common.cuh",
        "includesProgramModels/mynvshmem/include/nvshmem_constants.h",
        "includesProgramModels/mynvshmem/include/nvshmem_types.h"]
SPDX-License-Identifier = "LicenseRef-NVSHMEM"
SPDX-FileCopyrightText = ["2016-2021 NVIDIA Corporation",
                          "2025 Semih Burak, RWTH Aachen University"]
